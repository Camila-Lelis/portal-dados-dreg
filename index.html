<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Dados DREG</title>
<style>
  :root {
    --bg: #080f1c;
    --bg-card: #162a44;
    --bg-card-hover: #1c3252;
    --bg-header: #060d1a;
    --border: #1e3557;
    --border-hover: rgba(240,192,64,.4);
    --gold: #f0c040;
    --gold-dim: rgba(240,192,64,.12);
    --text: #dce8f5;
    --text-dim: #6b859e;
    --grtc: #2196f3;
    --ggat: #22c976;
    --geer: #f08030;
    --grec: #a855f7;
    --pbi: #f2c811;
    --sp: #03b8ba;
    --pa: #b36bba;
    --wb: #4fa8e8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--bg-header);
    border-bottom: 1px solid #162030;
    padding: 28px 48px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    position: relative;
    overflow: hidden;
  }

  header::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 80% at 50% -20%, rgba(240,192,64,.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .hd-left { display: flex; align-items: center; gap: 20px; }

  .hd-logo {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, #1a3555, #0d2040);
    border: 1px solid rgba(240,192,64,.3);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .hd-logo svg { width: auto; height: 46px; }

  .hd-texts { display: flex; flex-direction: column; }

  .hd-eyebrow {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-bottom: 3px;
  }

  .hd-title {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1;
  }

  .hd-title .portal { color: var(--text); }
  .hd-title .dreg   { color: var(--gold); margin-left: 8px; }

  .hd-right {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-shrink: 0;
  }

  .hd-stat {
    text-align: center;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 20px;
  }

  .hd-stat-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }

  .hd-stat-label {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ── CONTROLS ── */
  .controls {
    padding: 16px 48px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(6,13,26,.6);
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 380px;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
  }

  .search-wrap input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px 9px 38px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }

  .search-wrap input:focus { border-color: rgba(240,192,64,.5); }
  .search-wrap input::placeholder { color: var(--text-dim); }

  .divider { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; }

  .fbtn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 18px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .5px;
    transition: all .2s;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }

  .fbtn:hover { border-color: var(--gold); color: var(--gold); }

  .fbtn.active-all  { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
  .fbtn.active-grtc { border-color: var(--grtc); color: var(--grtc); background: rgba(33,150,243,.12); }
  .fbtn.active-ggat { border-color: var(--ggat); color: var(--ggat); background: rgba(34,201,118,.12); }
  .fbtn.active-geer { border-color: var(--geer); color: var(--geer); background: rgba(240,128,48,.12); }
  .fbtn.active-grec { border-color: var(--grec); color: var(--grec); background: rgba(168,85,247,.12); }

  .count-pill {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-dim);
    padding: 6px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    white-space: nowrap;
  }

  /* ── MAIN ── */
  main { padding: 32px 48px; }

  /* Section */
  .section { margin-bottom: 44px; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .section-bar {
    width: 4px; height: 20px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .grtc-bar { background: var(--grtc); }
  .ggat-bar { background: var(--ggat); }
  .geer-bar { background: var(--geer); }
  .grec-bar { background: var(--grec); }

  .section-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .section-full {
    font-size: 13px;
    color: var(--text-dim);
  }

  .section-cnt {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2px 10px;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }

  /* Card */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
    transition: all .25s ease;
  }

  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    border-radius: 14px 0 0 14px;
    transition: width .25s;
  }

  .card.grtc::before { background: var(--grtc); }
  .card.ggat::before { background: var(--ggat); }
  .card.geer::before { background: var(--geer); }
  .card.grec::before { background: var(--grec); }

  .card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }

  .card:hover::before { width: 5px; }

  /* Empty card (GREC sem BIs) */
  .card-empty {
    background: rgba(22,42,68,.4);
    border: 1px dashed rgba(168,85,247,.25);
    border-radius: 14px;
    padding: 28px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    opacity: .7;
  }

  .card-empty-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(168,85,247,.1);
    border: 1px solid rgba(168,85,247,.2);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 4px;
  }

  .card-empty-icon svg { width: 18px; height: 18px; color: var(--grec); }
  .card-empty-title { font-size: 13px; font-weight: 600; color: var(--text-dim); }
  .card-empty-sub   { font-size: 11px; color: var(--text-dim); opacity: .7; }

  /* Card top row */
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  /* Type badge */
  .type-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .type-badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .tb-powerbi    { background: rgba(242,200,17,.1);  color: var(--pbi); border: 1px solid rgba(242,200,17,.2); }
  .tb-powerbi .dot { background: var(--pbi); }

  .tb-sharepoint { background: rgba(3,184,186,.1);   color: var(--sp);  border: 1px solid rgba(3,184,186,.2); }
  .tb-sharepoint .dot { background: var(--sp); }

  .tb-powerapps  { background: rgba(179,107,186,.1); color: var(--pa);  border: 1px solid rgba(179,107,186,.2); }
  .tb-powerapps .dot { background: var(--pa); }

  .tb-web        { background: rgba(79,168,232,.1);  color: var(--wb);  border: 1px solid rgba(79,168,232,.2); }
  .tb-web .dot   { background: var(--wb); }

  /* Gerencia badge */
  .ger-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .5px;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .gb-GRTC { background: rgba(33,150,243,.18);  color: #60b8ff; border: 1px solid rgba(33,150,243,.3); }
  .gb-GGAT { background: rgba(34,201,118,.18);  color: #5deba0; border: 1px solid rgba(34,201,118,.3); }
  .gb-GEER { background: rgba(240,128,48,.18);  color: #ffaa60; border: 1px solid rgba(240,128,48,.3); }
  .gb-GREC { background: rgba(168,85,247,.18);  color: #cc88ff; border: 1px solid rgba(168,85,247,.3); }

  /* Card name */
  .card-nome {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
  }

  .card-produto {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.4;
  }

  /* Card footer */
  .card-footer {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
  }

  .btn-access {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--gold-dim);
    border: 1px solid rgba(240,192,64,.3);
    color: var(--gold);
    padding: 7px 18px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    transition: all .2s;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }

  .btn-access:hover {
    background: rgba(240,192,64,.2);
    border-color: var(--gold);
  }

  .btn-access svg { width: 13px; height: 13px; }

  /* No results */
  .no-results {
    display: none;
    text-align: center;
    padding: 72px 24px;
    color: var(--text-dim);
  }

  .no-results svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: .35; }
  .no-results h3 { font-size: 18px; margin-bottom: 6px; color: var(--text); }

  .hidden { display: none !important; }

  /* Footer */
  footer {
    margin-top: 16px;
    padding: 18px 48px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
  }

  /* Responsive */
  @media (max-width: 768px) {
    header, .controls, main, footer { padding-left: 20px; padding-right: 20px; }
    .hd-title { font-size: 22px; }
    .hd-stat { padding: 8px 14px; }
    .hd-right { gap: 12px; }
    .count-pill { display: none; }
  }

  @media (max-width: 480px) {
    .hd-right { display: none; }
  }
</style>
</head>

<!-- ════════════ MAIN ════════════ -->
<main id="main"></main>

<div class="no-results" id="no-results">

let activeFilter = 'all';

function setFilter(f) {
  activeFilter = f;
  ['all','GRTC','GGAT','GEER','GREC'].forEach(k => {
    const btn = document.getElementById('btn-' + k);
    btn.className = 'fbtn';
    if (k === f) btn.classList.add(k === 'all' ? 'active-all' : 'active-' + k.toLowerCase());
  });
  render();
}

function card(item) {
  const typeLabel = TYPE_LABELS[item.tipo] || item.tipo;
  return `
    <div class="card ${item.gerencia.toLowerCase()}">
      <div class="card-top">
        <span class="type-badge tb-${item.tipo}">
          <span class="dot"></span>${typeLabel}
        </span>
        <span class="ger-badge gb-${item.gerencia}">${item.gerencia}</span>
      </div>
      <div class="card-nome">${item.nome}</div>
      <div class="card-produto">${item.produto}</div>
      <div class="card-footer">
        <a class="btn-access" href="${item.url}" target="_blank" rel="noopener noreferrer">
          Acessar
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </a>
      </div>
    </div>`;
}

function emptyGREC() {
  return `
    <div class="card-empty">
      <div class="card-empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="card-empty-title">Indicadores em desenvolvimento</div>
      <div class="card-empty-sub">Os BIs da GREC serão adicionados em breve.</div>
    </div>`;
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const mainEl = document.getElementById('main');
  const noRes  = document.getElementById('no-results');
  const pill   = document.getElementById('count-pill');

  let filtered = DATA.filter(d => {
    const matchFilter = activeFilter === 'all' || d.gerencia === activeFilter;
    const matchSearch = !q || d.nome.toLowerCase().includes(q) || d.produto.toLowerCase().includes(q) || d.gerencia.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });

  const showGREC = (activeFilter === 'all' || activeFilter === 'GREC') && !q;

  pill.textContent = filtered.length + ' indicador' + (filtered.length !== 1 ? 'es' : '');

  if (filtered.length === 0 && !showGREC) {
    mainEl.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  let html = '';
  SECTIONS.forEach(sec => {
    if (sec.id === 'GREC') {
      if (!showGREC) return;
      html += `
        <div class="section">
          <div class="section-header">
            <div class="section-bar ${sec.barClass}"></div>
            <span class="section-name">${sec.id}</span>
            <span class="section-full">${sec.full}</span>
            <span class="section-cnt">Em breve</span>
          </div>
          <div class="grid">${emptyGREC()}</div>
        </div>`;
      return;
    }

    const items = filtered.filter(d => d.gerencia === sec.id);
    if (items.length === 0) return;

    html += `
      <div class="section">
        <div class="section-header">
          <div class="section-bar ${sec.barClass}"></div>
          <span class="section-name">${sec.id}</span>
          <span class="section-full">${sec.full}</span>
          <span class="section-cnt">${items.length}</span>
        </div>
        <div class="grid">
          ${items.map(card).join('')}
        </div>
      </div>`;
  });

  mainEl.innerHTML = html;
}

render();
