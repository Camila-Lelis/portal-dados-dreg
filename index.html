<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Dados | Diretoria de Regulação | Grupo Energisa</title>
<style>
/* ============================================================
   PORTAL DE DADOS DREG / componente para a página do SharePoint
   Mesmo padrão visual do componente das gerências.

   Este arquivo usa JavaScript (busca e filtros). Funciona porque
   é servido pelo GitHub Pages e entra na página do SharePoint
   dentro de um iframe: o bloqueio de script do SharePoint vale
   para código colado direto na página, não para página remota.
   ============================================================ */

:root{
  /* cores das gerências, iguais às do componente das gerências */
  --geer:#F37021;  --geer-tx:#C75410;  --geer-bg:rgba(243,112,33,.10);  --geer-bd:rgba(243,112,33,.30);
  --grec:#C2CD23;  --grec-tx:#7C8410;  --grec-bg:rgba(194,205,35,.15);  --grec-bd:rgba(194,205,35,.42);
  --grtc:#009FC2;  --grtc-tx:#007894;  --grtc-bg:rgba(0,159,194,.10);   --grtc-bd:rgba(0,159,194,.30);
  --ggat:#56B7AB;  --ggat-tx:#2F8C81;  --ggat-bg:rgba(86,183,171,.14);  --ggat-bd:rgba(86,183,171,.38);
  /* marcas dos produtos: ponto sólido, fundo, borda e texto de cada etiqueta */
  --pbi:#F2C811; --pbi-bg:rgba(242,200,17,.22); --pbi-bd:rgba(203,167,10,.60); --pbi-tx:#7A6200;
  --spo:#038387; --spo-bg:rgba(3,131,135,.14);  --spo-bd:rgba(3,131,135,.42);  --spo-tx:#02696C;
  --pap:#8B2FA0; --pap-bg:rgba(139,47,160,.13); --pap-bd:rgba(139,47,160,.40); --pap-tx:#75218A;
  --web:#4A7FA5; --web-bg:rgba(74,127,165,.14); --web-bd:rgba(74,127,165,.42); --web-tx:#3B6A8C;
  /* neutros */
  --nv:#004758; --ink:#1F2A33; --muted:#5B6B78; --soft:#71838E;
  --border:#E3E9EE; --bg:#F6F8FA; --wh:#FFFFFF;
}
*{ box-sizing:border-box; }
body{
  margin:0; padding:0; background:var(--wh); color:var(--ink);
  font-family:"Segoe UI",Inter,system-ui,-apple-system,Arial,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
/* ════════════════════════════════════════════════════════════
   CABEÇALHO PADRÃO DOS TÓPICOS
   Bloco reutilizável: copiar este trecho de CSS junto com o
   elemento de cabeçalho correspondente em qualquer outro tópico
   do site, trocando apenas o texto do título.
   ════════════════════════════════════════════════════════════ */
.topbar{
  --sym:clamp(82px,9.2vw,114px);   /* largura do símbolo da diretoria */
  position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  /* recuo vertical curto de propósito: é o que deixa a faixa baixa
     mesmo com o símbolo grande, que quase preenche a altura dela */
  min-height:clamp(92px,9.8vw,122px);
  padding:4px 0;
  background:linear-gradient(100deg,
    #124A44 0%, #165D54 23%, #12776F 49%, #0F6E6B 66%, #0A4750 100%);
}
/* O fundo sangra de ponta a ponta, mas o conteúdo segue a mesma
   largura máxima e o mesmo recuo lateral do .wrap. É isso que alinha
   o símbolo com a borda direita dos painéis logo abaixo. */
.tb-inner{
  position:relative; z-index:2;
  width:100%; max-width:1180px; margin:0 auto; padding:0 22px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
}
.topbar::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse 10% 120% at 18% 48%, rgba(255,255,255,.40), rgba(255,255,255,.07) 34%, transparent 66%),
    radial-gradient(ellipse 36% 190% at 30% 50%, rgba(150,240,228,.11), transparent 64%),
    radial-gradient(ellipse 60% 140% at 50% 120%, rgba(0,0,0,.20), transparent 62%);
}
.topbar::after{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.55;
  background-image:radial-gradient(circle, rgba(255,255,255,.60) .9px, transparent 1.15px);
  background-size:9px 9px;
  -webkit-mask-image:linear-gradient(90deg, transparent 50%, #000 76%, rgba(0,0,0,.35) 100%);
          mask-image:linear-gradient(90deg, transparent 50%, #000 76%, rgba(0,0,0,.35) 100%);
}
.tb-art{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

.tb-title{
  position:relative; z-index:2; flex:1; min-width:0; margin:0; text-align:center;
  color:#fff; font-style:italic; font-weight:800;
  font-size:clamp(19px,2.7vw,34px); line-height:1.15; letter-spacing:.2px;
  text-shadow:0 2px 12px rgba(0,0,0,.30);
}
/* espaçador do mesmo tamanho do símbolo: é ele que mantém o título
   opticamente centralizado, em vez de deslocado para a esquerda */
.tb-vazio{ flex:0 0 var(--sym); width:var(--sym); }
.tb-sym{ flex:0 0 var(--sym); width:var(--sym); height:auto; }
@media(max-width:620px){ .tb-inner{ padding:0 15px; } }
@media(max-width:560px){
  .tb-vazio{ display:none; }
  .topbar{ --sym:66px; }
}
/* ══════════════════ fim do cabeçalho padrão ══════════════════ */

/* ════════════════════════════════════════════════════════════
   SÍMBOLO 3D DA DIRETORIA
   Cinco camadas orbitais em torno de uma esfera. Cada órbita tem
   raio próprio, o que separa GRTC e GGAT, cujas cores são as mais
   próximas da paleta.
   A esfera fica NO MEIO das órbitas: cada órbita é partida em duas,
   a metade de cima (distante) atrás da esfera e a de baixo (próxima)
   na frente. Cada partícula tem duas cópias, uma por camada, e a
   troca acontece nos extremos laterais, fora da silhueta da esfera.
   ════════════════════════════════════════════════════════════ */
.s3{ display:block; overflow:visible; }

/* As quatro peças de cada órbita recebem a MESMA rotação animada.
   Vivem em camadas diferentes e não podem ficar no mesmo grupo, então
   é a animação idêntica que as mantém coladas. transform-box:view-box
   fixa a origem no centro do viewBox, e não no contorno de cada
   elemento, que mudaria conforme a partícula anda. */
.s3 .plano{
  transform-box:view-box; transform-origin:50px 50px;
  animation-timing-function:linear; animation-iteration-count:infinite;
}
.s3 .pl-grtc{ animation-name:plano000; animation-duration:43s; }
.s3 .pl-geer{ animation-name:plano036; animation-duration:37s; }
.s3 .pl-ggat{ animation-name:plano072; animation-duration:54s; }
.s3 .pl-grec{ animation-name:plano108; animation-duration:49s; }
.s3 .pl-asse{ animation-name:plano144; animation-duration:63s; }
@keyframes plano000{ from{ transform:rotate(0deg);   } to{ transform:rotate(360deg);  } }
@keyframes plano036{ from{ transform:rotate(36deg);  } to{ transform:rotate(-324deg); } }
@keyframes plano072{ from{ transform:rotate(72deg);  } to{ transform:rotate(432deg);  } }
@keyframes plano108{ from{ transform:rotate(108deg); } to{ transform:rotate(-252deg); } }
@keyframes plano144{ from{ transform:rotate(144deg); } to{ transform:rotate(504deg);  } }

.s3 .esfera{ transform-box:fill-box; transform-origin:center; animation:respira 10s ease-in-out infinite; }
@keyframes respira{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }
.s3 .brilho{ transform-box:fill-box; transform-origin:center; animation:brilha 10s ease-in-out infinite; }
@keyframes brilha{ 0%,100%{ transform:translate(0,0); opacity:.92; } 50%{ transform:translate(1.5px,-1px); opacity:1; } }

/* O caminho parte do extremo esquerdo e, com sweep 0, desce primeiro:
   0 a 50% é a metade de baixo, a PRÓXIMA; 50 a 100% é a de cima, a DISTANTE. */
.s3 .part{
  offset-rotate:0deg;
  transform-box:fill-box; transform-origin:center;
  animation-timing-function:linear; animation-iteration-count:infinite;
}
.s3 .p-grtc{ offset-path:path('M 14,50   a 36,14     0 1,0 72,0 a 36,14     0 1,0 -72,0'); animation-duration:14s,  14s,  14s;   }
.s3 .p-geer{ offset-path:path('M 16,50   a 34,13     0 1,0 68,0 a 34,13     0 1,0 -68,0'); animation-duration:12.2s,12.2s,12.2s; animation-delay:-4.3s,-4.3s,-4.3s; }
.s3 .p-ggat{ offset-path:path('M 19,50   a 31,11.5   0 1,0 62,0 a 31,11.5   0 1,0 -62,0'); animation-duration:18s,  18s,  18s;   animation-delay:-8.6s,-8.6s,-8.6s; }
.s3 .p-grec{ offset-path:path('M 21.5,50 a 28.5,10.5 0 1,0 57,0 a 28.5,10.5 0 1,0 -57,0'); animation-duration:15.7s,15.7s,15.7s; animation-delay:-2.1s,-2.1s,-2.1s; }
.s3 .p-asse{ offset-path:path('M 24,50   a 26,9.5    0 1,0 52,0 a 26,9.5    0 1,0 -52,0'); animation-duration:20.3s,20.3s,20.3s; animation-delay:-11.4s,-11.4s,-11.4s; }

@keyframes orbVolta{ to{ offset-distance:100%; } }
@keyframes orbEscala{
  0%  { transform:scale(1);    }  /* lateral esquerda  */
  25% { transform:scale(1.20); }  /* embaixo, próxima  */
  50% { transform:scale(1);    }  /* lateral direita   */
  75% { transform:scale(.60);  }  /* em cima, distante */
  100%{ transform:scale(1);    }
}
.s3 .pn{ animation-name:orbVolta, orbEscala, orbCamadaFrente; }
@keyframes orbCamadaFrente{ 0%,49.9%{ opacity:1; } 50%,100%{ opacity:0; } }
.s3 .pf{ animation-name:orbVolta, orbEscala, orbCamadaFundo; }
@keyframes orbCamadaFundo{ 0%,49.9%{ opacity:0; } 50%,100%{ opacity:1; } }

.wrap{ max-width:1180px; margin:0 auto; padding:26px 22px 34px; }

/* ---------------- topo ---------------- */
.top-sub{ margin:0 0 18px; color:var(--muted); font-size:13.5px; line-height:1.55; max-width:660px; }

/* ---------------- controles ---------------- */
.controls{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 14px; margin-bottom:22px;
  border:1px solid var(--border); border-radius:11px; background:var(--bg);
}
.search{ position:relative; flex:1 1 250px; min-width:200px; }
.search svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%);
  color:var(--soft); pointer-events:none; }
.search input{
  width:100%; padding:9px 12px 9px 33px; font-family:inherit; font-size:13px;
  color:var(--ink); background:var(--wh);
  border:1px solid var(--border); border-radius:8px; outline:none;
  transition:border-color .18s, box-shadow .18s;
}
.search input::placeholder{ color:var(--soft); }
.search input:focus{ border-color:var(--grtc); box-shadow:0 0 0 3px rgba(0,159,194,.16); }

.filters{ display:flex; gap:6px; flex-wrap:wrap; }
.fbtn{
  padding:7px 13px; border-radius:20px; cursor:pointer;
  font-family:inherit; font-size:12px; font-weight:700; letter-spacing:.2px;
  color:var(--muted); background:var(--wh); border:1px solid var(--border);
  transition:all .18s;
}
.fbtn:hover{ border-color:var(--soft); color:var(--nv); }
.fbtn:focus-visible{ outline:2px solid var(--grtc); outline-offset:2px; }
.fbtn.on{ color:#fff; }
.fbtn.on.f-all { background:var(--nv);   border-color:var(--nv); }
.fbtn.on.f-GEER{ background:var(--geer); border-color:var(--geer); }
.fbtn.on.f-GREC{ background:var(--grec); border-color:var(--grec); color:#4E5408; }
.fbtn.on.f-GRTC{ background:var(--grtc); border-color:var(--grtc); }
.fbtn.on.f-GGAT{ background:var(--ggat); border-color:var(--ggat); }

.count{ margin-left:auto; color:var(--soft); font-size:11.5px; font-weight:650; white-space:nowrap; }
.count b{ color:var(--nv); font-weight:800; }

/* ---------------- seções por gerência ---------------- */
.section{ margin-bottom:26px; }
.section:last-child{ margin-bottom:0; }
.sec-head{ display:flex; align-items:center; gap:11px; flex-wrap:wrap;
  margin-bottom:12px; padding-bottom:9px; border-bottom:1px solid var(--border); }
.sec-bar{ width:5px; height:20px; border-radius:3px; background:var(--cor); flex-shrink:0; }
.sec-sigla{ color:var(--cor-tx); font-size:17px; font-weight:820; letter-spacing:.4px; line-height:1; }
.sec-nome{ color:var(--muted); font-size:12.5px; font-weight:500; }
.sec-cnt{ margin-left:auto; padding:2px 10px; border-radius:20px;
  background:var(--cor-bg); border:1px solid var(--cor-bd);
  color:var(--cor-tx); font-size:11px; font-weight:750; white-space:nowrap; }

/* TESTE: preenchimento chapado no lugar do degradê.
   --cor-fill é o fundo do cartão, na cor da gerência. A borda colorida
   continua só na lateral esquerda, como antes.
   Cada cor tem peso visual diferente, então a opacidade do preenchimento
   é calibrada uma a uma: o verde-limão precisa de mais que o azul para
   render a mesma presença. */
.section.geer{ --cor:var(--geer); --cor-tx:var(--geer-tx); --cor-bg:var(--geer-bg); --cor-bd:var(--geer-bd);
  --cor-fill:rgba(243,112,33,.14); }
.section.grec{ --cor:var(--grec); --cor-tx:var(--grec-tx); --cor-bg:var(--grec-bg); --cor-bd:var(--grec-bd);
  --cor-fill:rgba(194,205,35,.22); }
.section.grtc{ --cor:var(--grtc); --cor-tx:var(--grtc-tx); --cor-bg:var(--grtc-bg); --cor-bd:var(--grtc-bd);
  --cor-fill:rgba(0,159,194,.13); }
.section.ggat{ --cor:var(--ggat); --cor-tx:var(--ggat-tx); --cor-bg:var(--ggat-bg); --cor-bd:var(--ggat-bd);
  --cor-fill:rgba(86,183,171,.18); }

/* ---------------- cartões de indicador ---------------- */
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); gap:13px; }

.card{
  display:flex; flex-direction:column; min-height:0;
  padding:13px 15px 13px; border-radius:12px;
  background:var(--cor-fill);
  border:1px solid var(--border); border-left:4px solid var(--cor);
  box-shadow:0 1px 3px rgba(31,42,51,.05);
  transition:box-shadow .22s ease, transform .22s ease, border-color .22s ease;
}
.card:hover,.card:focus-within{
  box-shadow:0 9px 24px rgba(24,55,72,.13); transform:translateY(-2px);
  border-top-color:var(--cor-bd); border-right-color:var(--cor-bd); border-bottom-color:var(--cor-bd);
}
/* a etiqueta da ferramenta fica sozinha, encostada à direita */
.card-top{ display:flex; justify-content:flex-end; margin-bottom:7px; }
/* Etiqueta da ferramenta: cor cheia da marca do produto, para distinguir
   à distância um Power BI de um Power Apps sem precisar ler. */
.tipo{
  display:inline-flex; align-items:center; gap:5px;
  padding:3.5px 10px; border-radius:20px;
  background:var(--tc-bg); border:1px solid var(--tc-bd); color:var(--tc-tx);
  font-size:10px; font-weight:800; letter-spacing:.35px; white-space:nowrap;
}
.tipo .dot{ width:6px; height:6px; border-radius:50%; background:var(--tc); flex-shrink:0;
  box-shadow:0 0 0 2px rgba(255,255,255,.65); }
.tipo.powerbi   { --tc:var(--pbi); --tc-bg:var(--pbi-bg); --tc-bd:var(--pbi-bd); --tc-tx:var(--pbi-tx); }
.tipo.sharepoint{ --tc:var(--spo); --tc-bg:var(--spo-bg); --tc-bd:var(--spo-bd); --tc-tx:var(--spo-tx); }
.tipo.powerapps { --tc:var(--pap); --tc-bg:var(--pap-bg); --tc-bd:var(--pap-bd); --tc-tx:var(--pap-tx); }
.tipo.web       { --tc:var(--web); --tc-bg:var(--web-bg); --tc-bd:var(--web-bd); --tc-tx:var(--web-tx); }

.card-nome{ margin:0 0 5px; color:var(--nv); font-size:16.5px; font-weight:720;
  line-height:1.24; letter-spacing:-.3px; }
.card-produto{ margin:0; color:var(--muted); font-size:11.5px; line-height:1.4; }

.card-foot{ margin-top:auto; padding-top:12px; }
.acessar{
  display:inline-flex; align-items:center; gap:6px; text-decoration:none;
  color:var(--cor-tx); font-size:12px; font-weight:750;
  transition:gap .18s;
}
.acessar svg{ width:13px; height:13px; transition:transform .18s; }
.card:hover .acessar svg{ transform:translateX(3px); }
.acessar:focus-visible{ outline:2px solid var(--cor); outline-offset:3px; border-radius:3px; }

/* Nome do indicador repetido só para leitor de tela: sem isso o link
   anuncia apenas "Acessar", igual em todos os cartões. */
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* ---------------- estado vazio ---------------- */
.vazio{
  grid-column:1 / -1; padding:22px 18px; border-radius:12px;
  border:1px dashed var(--cor-bd); background:var(--bg); text-align:center;
}
.vazio-t{ margin:0 0 3px; color:var(--nv); font-size:13px; font-weight:700; }
.vazio-s{ margin:0; color:var(--muted); font-size:12px; }

.sem-resultado{ display:none; padding:40px 20px; text-align:center; }
.sem-resultado h3{ margin:0 0 5px; color:var(--nv); font-size:15px; font-weight:700; }
.sem-resultado p{ margin:0; color:var(--muted); font-size:13px; }

/* ---------------- responsivo ---------------- */
@media(max-width:620px){
  .wrap{ padding:20px 15px 26px; }
  .count{ margin-left:0; }
  .grid{ grid-template-columns:1fr; }
}
@media(prefers-reduced-motion:reduce){
  *{ transition-duration:.01ms!important; }
  /* o símbolo congela; o desenho permanece legível */
  .s3 .plano,.s3 .esfera,.s3 .brilho,.s3 .part{ animation:none!important; }
  .s3 .pf{ opacity:1; }
}
</style>
</head>
<body>

<!-- ══════════ CABEÇALHO PADRÃO DO TÓPICO ══════════ -->
<header class="topbar">
  <svg class="tb-art" viewBox="0 0 1200 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <g fill="none" stroke="#FFFFFF" opacity=".24">
      <path d="M-20 76 C 260 44, 540 27, 1220 7"   stroke-width="1"/>
      <path d="M-20 90 C 300 60, 650 41, 1220 27"  stroke-width=".8" opacity=".62"/>
      <path d="M-20 34 C 240 20, 520 13, 1220 -2"  stroke-width=".7" opacity=".45"/>
    </g>
    <g fill="none" stroke="#BFF3EC" opacity=".55">
      <path d="M830 -12 C 892 30, 934 60, 1006 112" stroke-width="1.2"/>
      <path d="M902 -12 C 968 34, 1004 62, 1078 112" stroke-width=".9" opacity=".72"/>
      <path d="M-20 62 C 220 31, 430 21, 780 13"    stroke-width=".9" opacity=".6"/>
    </g>
  </svg>
  <div class="tb-inner">
  <div class="tb-vazio" aria-hidden="true"></div>
  <h1 class="tb-title">Portal de Dados DREG</h1>

  <!-- Símbolo da diretoria: esfera e cinco camadas orbitais -->
  <svg class="s3 tb-sym" viewBox="0 0 100 100" role="img"
       aria-label="Símbolo da Diretoria de Regulação: as quatro gerências e as assessorias orbitando um núcleo">
    <defs>
      <radialGradient id="g-esfera" cx="34%" cy="28%" r="78%">
        <stop offset="0%"   stop-color="#5FE0EE"/>
        <stop offset="24%"  stop-color="#1BA5BA"/>
        <stop offset="62%"  stop-color="#0B6E7E"/>
        <stop offset="88%"  stop-color="#064A57"/>
        <stop offset="100%" stop-color="#03323C"/>
      </radialGradient>
      <radialGradient id="g-rim" cx="50%" cy="50%" r="50%">
        <stop offset="76%"  stop-color="#5FE3F0" stop-opacity="0"/>
        <stop offset="94%"  stop-color="#5FE3F0" stop-opacity=".40"/>
        <stop offset="100%" stop-color="#9BF2FA" stop-opacity=".70"/>
      </radialGradient>
      <radialGradient id="g-brilho" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".92"/>
        <stop offset="55%"  stop-color="#FFFFFF" stop-opacity=".28"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- ATRÁS · metades distantes das órbitas -->
    <g fill="none" stroke-width="1.5" stroke-linecap="round">
      <path class="plano pl-grtc" d="M 14,50   A 36,14     0 0 1 86,50"   stroke="rgba(0,159,194,.48)"/>
      <path class="plano pl-geer" d="M 16,50   A 34,13     0 0 1 84,50"   stroke="rgba(243,112,33,.48)"/>
      <path class="plano pl-ggat" d="M 19,50   A 31,11.5   0 0 1 81,50"   stroke="rgba(86,183,171,.50)"/>
      <path class="plano pl-grec" d="M 21.5,50 A 28.5,10.5 0 0 1 78.5,50" stroke="rgba(194,205,35,.52)"/>
      <path class="plano pl-asse" d="M 24,50   A 26,9.5    0 0 1 76,50"   stroke="rgba(206,212,215,.46)"/>
    </g>
    <g class="plano pl-grtc"><circle class="part pf p-grtc" r="3.0" fill="#009FC2"/></g>
    <g class="plano pl-geer"><circle class="part pf p-geer" r="2.9" fill="#F37021"/></g>
    <g class="plano pl-ggat"><circle class="part pf p-ggat" r="2.6" fill="#56B7AB"/></g>
    <g class="plano pl-grec"><circle class="part pf p-grec" r="2.5" fill="#C2CD23"/></g>
    <g class="plano pl-asse"><circle class="part pf p-asse" r="2.3" fill="#CED4D7"/></g>

    <!-- A ESFERA -->
    <g class="esfera">

/* Ordem das seções: da gerência com mais indicadores para a com menos.
   O cálculo usa a base inteira, não o resultado filtrado, para que a ordem
   não se reembaralhe a cada tecla digitada na busca. Ordenar aqui, e não
   na mão, mantém a ordem correta quando um indicador for incluído. */
const TOTAL_POR_GERENCIA = DADOS.reduce((acc, d) => {
  acc[d.gerencia] = (acc[d.gerencia] || 0) + 1;
  return acc;
}, {});
SECOES.sort((a, b) => (TOTAL_POR_GERENCIA[b.id] || 0) - (TOTAL_POR_GERENCIA[a.id] || 0));

const elLista = document.getElementById('lista');
const elVazio = document.getElementById('sem-resultado');
const elCont  = document.getElementById('contagem');
const elBusca = document.getElementById('busca');

let filtro = 'all';

/* Escapa texto antes de injetar no HTML. Os dados são internos, mas um
   nome com & ou < quebraria a marcação silenciosamente. */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

function cartao(item){
  return `
    <article class="card">
      <div class="card-top">
        <span class="tipo ${item.tipo}"><span class="dot"></span>${esc(TIPOS[item.tipo] || item.tipo)}</span>
      </div>
      <h3 class="card-nome">${esc(item.nome)}</h3>
      <p class="card-produto">${esc(item.produto)}</p>
      <div class="card-foot">
        <a class="acessar" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">
          Acessar
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
          <span class="sr-only"> ${esc(item.nome)}</span>
        </a>
      </div>
    </article>`;
}

function render(){
  const q = elBusca.value.toLowerCase().trim();

  const visiveis = DADOS.filter(d => {
    const porFiltro = filtro === 'all' || d.gerencia === filtro;
    const porBusca  = !q
      || d.nome.toLowerCase().includes(q)
      || d.produto.toLowerCase().includes(q)
      || d.gerencia.toLowerCase().includes(q)
      || (TIPOS[d.tipo] || '').toLowerCase().includes(q);
    return porFiltro && porBusca;
  });

  elCont.innerHTML = '<b>' + visiveis.length + '</b> ' +
    (visiveis.length === 1 ? 'indicador' : 'indicadores');

  if (visiveis.length === 0){
    elLista.innerHTML = '';
    elVazio.style.display = 'block';
    return;
  }
  elVazio.style.display = 'none';

  elLista.innerHTML = SECOES.map(sec => {
    const itens = visiveis.filter(d => d.gerencia === sec.id);
    if (itens.length === 0) return '';
    return `
      <section class="section ${sec.id.toLowerCase()}">
        <div class="sec-head">
          <span class="sec-bar"></span>
          <span class="sec-sigla">${esc(sec.id)}</span>
          <span class="sec-nome">${esc(sec.nome)}</span>
          <span class="sec-cnt">${itens.length} ${itens.length === 1 ? 'indicador' : 'indicadores'}</span>
        </div>
        <div class="grid">${itens.map(cartao).join('')}</div>
      </section>`;
  }).join('');
}

document.querySelectorAll('.fbtn').forEach(b => {
  b.addEventListener('click', () => {
    filtro = b.dataset.f;
    document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    render();
  });
});
elBusca.addEventListener('input', render);

render();
</script>
